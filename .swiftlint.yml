included:
  - Sources
  - Tests

excluded:
  - .build
  - dist

only_rules:
  - colon
  - comma
  - control_statement
  - duplicate_imports
  - empty_count
  - force_cast
  - force_try
  - force_unwrapping
  - identical_operands
  - leading_whitespace
  - legacy_cggeometry_functions
  - legacy_constant
  - legacy_constructor
  - mark
  - operator_whitespace
  - redundant_nil_coalescing
  - redundant_void_return
  - return_arrow_whitespace
  - statement_position
  - syntactic_sugar
  - trailing_newline
  - trailing_semicolon
  - unneeded_break_in_switch
  - unused_closure_parameter
  - unused_optional_binding
  - vertical_whitespace
  - void_return

line_length:
  warning: 140
  error: 200

reporter: "github-actions"
